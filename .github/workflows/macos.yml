name: macOS

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Restore .NET dependencies
        run: dotnet restore
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/shiori-engine/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path native/shiori-engine/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path native/shiori-engine/Cargo.toml
      - name: Test .NET
        run: dotnet test --no-restore --verbosity minimal
      - name: Check .NET formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Package
        run: bash scripts/publish-macos.sh
      - name: Smoke test package
        run: |
          package="$(printf '%s\n' artifacts/shiori-v*-osx-* | head -n 1)"
          export SHIORI_DATA_HOME="${RUNNER_TEMP}/shiori-data"
          "${package}/shiori" doctor
          "${package}/shiori" ast '(class_declaration name: (identifier) @name)' \
            --language csharp --allow "${GITHUB_WORKSPACE}" --path src/Shiori.Core --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: shiori-${{ runner.arch }}-macos
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
