[package]
name = "shiori-engine"
version = "0.0.0"
edition = "2024"
license-file = "../../LICENSE"

[lib]
name = "shiori_engine"
crate-type = ["cdylib"]

[package.metadata.shiori]
version = "0.0.0.0"

[dependencies]
globset = "0.4.20"
ignore = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
